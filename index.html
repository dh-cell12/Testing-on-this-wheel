<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dinner Options </title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            135deg,
            #0b1220,
            #16263f
        );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}


/* ==========================================================
   MAIN CARD
   ========================================================== */

.card {

    width: min(720px, 100%);

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,255,255,0.15);

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35);
}


h1 {

    margin:
        0 0 8px;

    font-size:
        38px;
}


.subtitle {

    color:
        #c8d3e3;

    margin-bottom:
        25px;
}


/* ==========================================================
   WHEEL
   ========================================================== */

.wheel-wrap {

    position: relative;

    width:
        min(520px, 90vw);

    aspect-ratio:
        1;

    margin:
        auto;
}


canvas {

    width:
        100%;

    height:
        100%;

    display:
        block;

    border-radius:
        50%;

    background:
        white;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.4);
}


/* ==========================================================
   POINTER
   ========================================================== */

.pointer {

    position: absolute;

    top:
        -8px;

    left:
        50%;

    transform:
        translateX(-50%);

    width:
        0;

    height:
        0;

    border-left:
        18px solid transparent;

    border-right:
        18px solid transparent;

    border-top:
        38px solid #ffcf33;

    filter:
        drop-shadow(
            0 3px 4px
            rgba(0,0,0,0.5)
        );

    z-index:
        5;
}


/* ==========================================================
   CENTER RESULT
   ========================================================== */

.center-result {

    position: absolute;

    width:
        190px;

    height:
        190px;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%, -50%);

    border-radius:
        50%;

    background:
        rgba(10,18,32,0.94);

    border:
        6px solid white;

    z-index:
        4;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    padding:
        15px;

    opacity:
        0;

    transition:
        0.4s;

    pointer-events:
        none;

    box-shadow:
        0 0 30px
        rgba(255,207,51,0.7);
}


.center-result.show {

    opacity:
        1;
}


.result-title {

    font-size:
        13px;

    color:
        #c8d3e3;

    margin-bottom:
        8px;

    text-transform:
        uppercase;

    letter-spacing:
        1px;
}


.result-name {

    font-size:
        25px;

    font-weight:
        bold;

    color:
        #ffcf33;

    line-height:
        1.2;
}


/* ==========================================================
   BUTTON
   ========================================================== */

button {

    border:
        none;

    border-radius:
        999px;

    padding:
        15px 45px;

    margin-top:
        25px;

    font-size:
        20px;

    font-weight:
        bold;

    cursor:
        pointer;

    color:
        #101a2b;

    background:
        #ffcf33;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,0.3);

    transition:
        0.15s;
}


button:hover {

    transform:
        translateY(-2px);
}


button:active {

    transform:
        translateY(1px);
}


button:disabled {

    opacity:
        0.5;

    cursor:
        not-allowed;
}


/* ==========================================================
   RESULT TEXT
   ========================================================== */

.result {

    min-height:
        35px;

    margin-top:
        22px;

    font-size:
        23px;

    font-weight:
        bold;
}


/* ==========================================================
   HINT
   ========================================================== */

.hint {

    margin-top:
        18px;

    font-size:
        13px;

    color:
        #aebbd0;
}

</style>

</head>


<body>


<div class="card">


    <h1>
        Dinner Options
    </h1>


    <p class="subtitle">
        Spin the wheel and let fate decide 🍽️
    </p>


    <div class="wheel-wrap">


        <div class="pointer"></div>


        <canvas
            id="wheel"
            width="700"
            height="700">
        </canvas>


        <!-- Result in centre -->

        <div
            class="center-result"
            id="centerResult">

            <div class="result-title">
                Tonight's dinner
            </div>

            <div
                class="result-name"
                id="centerResultName">

            </div>

        </div>


    </div>


    <button id="spinBtn">
        🎡 SPIN
    </button>


    <div
        class="result"
        id="result">

        Ready?

    </div>


    <div class="hint">

        Guess What We Will Be Having for Tonight 😋

    </div>


</div>



<script>


/* ==========================================================
   DINNER OPTIONS
   ========================================================== */

const options = [

    "Japanese 🇯🇵",
    "Korean 🇰🇷",
    "Chinese 🇨🇳",
    "Thai 🇹🇭",
    "Malaysian 🇲🇾",
    "Indian 🇮🇳",
    "Italian 🇮🇹",
];


/* ==========================================================
   SETUP
   ========================================================== */

const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const spinBtn =
    document.getElementById("spinBtn");

const result =
    document.getElementById("result");

const centerResult =
    document.getElementById("centerResult");

const centerResultName =
    document.getElementById("centerResultName");


const cx =
    canvas.width / 2;

const cy =
    canvas.height / 2;

const radius =
    325;

const slice =
    (Math.PI * 2) /
    options.length;


let rotation = 0;

let spinning = false;

let selectedIndex = null;


/* ==========================================================
   COLOURS
   ========================================================== */

const colors = [

    "#1f6feb",
    "#16a085",
    "#f39c12",
    "#e74c3c",
    "#8e44ad",
    "#00a8cc",
    "#34495e",
    "#d35400"

];


/* ==========================================================
   DRAW WHEEL
   ========================================================== */

function drawWheel() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    for (
        let i = 0;
        i < options.length;
        i++
    ) {


        const start =
            rotation +
            i * slice;


        const end =
            start +
            slice;


        /* --------------------------------------------------
           SLICE
        -------------------------------------------------- */

        ctx.beginPath();


        ctx.moveTo(
            cx,
            cy
        );


        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );


        ctx.closePath();


        /*
           If we have a selected result,
           darken all other slices.
        */

        if (
            selectedIndex !== null &&
            i !== selectedIndex
        ) {

            ctx.fillStyle =
                "rgba(20,25,35,0.88)";

        } else {

            ctx.fillStyle =
                colors[
                    i % colors.length
                ];

        }


        ctx.fill();


        /* --------------------------------------------------
           SELECTED SLICE GLOW
        -------------------------------------------------- */

        if (
            selectedIndex !== null &&
            i === selectedIndex
        ) {

            ctx.shadowColor =
                "#ffcf33";

            ctx.shadowBlur =
                30;

            ctx.strokeStyle =
                "#ffcf33";

            ctx.lineWidth =
                10;

        } else {

            ctx.shadowBlur =
                0;

            ctx.strokeStyle =
                "rgba(255,255,255,0.85)";

            ctx.lineWidth =
                4;

        }


        ctx.stroke();


        ctx.shadowBlur =
            0;


        /* --------------------------------------------------
           TEXT
        -------------------------------------------------- */

        ctx.save();


        ctx.translate(
            cx,
            cy
        );


        ctx.rotate(
            start +
            slice / 2
        );


        ctx.textAlign =
            "right";

        ctx.textBaseline =
            "middle";


        /*
           Darken text for non-selected options
        */

        if (
            selectedIndex !== null &&
            i !== selectedIndex
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,0.25)";

        } else {

            ctx.fillStyle =
                "white";

        }


        let text =
            options[i];


        if (
            text.length > 18
        ) {

            ctx.font =
                "bold 18px Arial";

        } else {

            ctx.font =
                "bold 23px Arial";

        }


        ctx.fillText(
            text,
            radius - 25,
            0
        );


        ctx.restore();

    }


    /* ======================================================
       OUTER CIRCLE
    ====================================================== */

    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
    );


    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        8;


    ctx.stroke();

}


/* ==========================================================
   FIND SELECTED OPTION
   ========================================================== */

function getSelectedIndex() {


    const pointerAngle =
        (
            -Math.PI / 2 -
            rotation
        ) %
        (Math.PI * 2);


    let angle =
        pointerAngle;


    if (
        angle < 0
    ) {

        angle +=
            Math.PI * 2;

    }


    const index =
        Math.floor(
            angle / slice
        );


    return (
        index %
        options.length
    );

}


/* ==========================================================
   SPIN
   ========================================================== */

function spin() {


    if (
        spinning
    ) {

        return;

    }


    /*
       Reset previous result
    */

    selectedIndex =
        null;

    centerResult.classList.remove(
        "show"
    );


    drawWheel();


    spinning =
        true;


    spinBtn.disabled =
        true;


    spinBtn.textContent =
        "SPINNING...";


    result.textContent =
        "Spinning... 🎡";


    /* ------------------------------------------------------
       RANDOM ROTATION
    ------------------------------------------------------ */

    const extraRotations =
        5 +
        Math.floor(
            Math.random() * 4
        );


    const randomAngle =
        Math.random() *
        Math.PI *
        2;


    const startRotation =
        rotation;


    const targetRotation =
        rotation +
        extraRotations *
        Math.PI *
        2 +
        randomAngle;


    const duration =
        4200;


    const startTime =
        performance.now();


    /* ------------------------------------------------------
       ANIMATION
    ------------------------------------------------------ */

    function animate(now) {


        const elapsed =
            now -
            startTime;


        const progress =
            Math.min(
                elapsed /
                duration,
                1
            );


        /*
           Smooth slow down
        */

        const eased =
            1 -
            Math.pow(
                1 - progress,
                4
            );


        rotation =
            startRotation +
            (
                targetRotation -
                startRotation
            ) *
            eased;


        drawWheel();


        if (
            progress < 1
        ) {


            requestAnimationFrame(
                animate
            );


        } else {


            rotation =
                targetRotation;


            drawWheel();


            /*
               Find winner
            */

            selectedIndex =
                getSelectedIndex();


            const winner =
                options[
                    selectedIndex
                ];


            /*
               Show result
            */

            result.textContent =
                "Let's eat " +
                winner;


            centerResultName.textContent =
                winner;


            /*
               Redraw with
               selected slice highlighted
            */

            drawWheel();


            /*
               Show centre result
            */

            setTimeout(
                () => {

                    centerResult.classList.add(
                        "show"
                    );

                },
                200
            );


            spinning =
                false;


            spinBtn.disabled =
                false;


            spinBtn.textContent =
                "🔄 SPIN AGAIN";

        }

    }


    requestAnimationFrame(
        animate
    );

}


/* ==========================================================
   BUTTON
   ========================================================== */

spinBtn.addEventListener(
    "click",
    spin
);


/* ==========================================================
   INITIAL DRAW
   ========================================================== */

drawWheel();


</script>

</body>
</html>
