<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Travel Selector</title>


<style>

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #0b1220,
        #1d4266
    );

    color: white;

    text-align: center;

    padding: 40px 20px;

}


.container {

    max-width: 800px;

    margin: auto;

}


h1 {

    font-size: 42px;

    margin-bottom: 10px;

}


.subtitle {

    color: #cbd5e1;

    margin-bottom: 35px;

    font-size: 18px;

}


.country-buttons {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));

    gap: 15px;

}


.country {

    padding: 20px;

    border: none;

    border-radius: 15px;

    background: white;

    color: #172033;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.country:hover {

    transform: translateY(-4px);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.3);

}


#destinationSection {

    display: none;

    margin-top: 45px;

}


.destination-list {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));

    gap: 12px;

    margin-top: 25px;

}


.destination {

    background:
        rgba(255,255,255,0.12);

    border:
        1px solid
        rgba(255,255,255,0.2);

    padding: 18px;

    border-radius: 12px;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;

}


.destination:hover {

    background:
        rgba(255,255,255,0.25);

    transform: translateY(-3px);

}


.pick {

    margin-top: 30px;

    padding: 15px 35px;

    border: none;

    border-radius: 30px;

    background: #ffcf33;

    color: #111827;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

}


.pick:hover {

    transform: translateY(-2px);

}


.result {

    margin-top: 30px;

    font-size: 27px;

    font-weight: bold;

}


.back {

    margin-top: 30px;

    padding: 10px 25px;

    border: none;

    border-radius: 20px;

    cursor: pointer;

}


</style>

</head>


<body>


<div class="container">


<h1>✈️ Travel Selector</h1>


<p class="subtitle">

Where should we go next?

</p>


<h2>Choose a country</h2>


<div class="country-buttons">


<button
class="country"
onclick="showDestinations('Japan')">

🇯🇵 Japan

</button>


<button
class="country"
onclick="showDestinations('Korea')">

🇰🇷 Korea

</button>


<button
class="country"
onclick="showDestinations('China')">

🇨🇳 China

</button>


<button
class="country"
onclick="showDestinations('Thailand')">

🇹🇭 Thailand

</button>


<button
class="country"
onclick="showDestinations('Malaysia')">

🇲🇾 Malaysia

</button>


<button
class="country"
onclick="showDestinations('Indonesia')">

🇮🇩 Indonesia

</button>


<button
class="country"
onclick="showDestinations('Vietnam')">

🇻🇳 Vietnam

</button>


<button
class="country"
onclick="showDestinations('Taiwan')">

🇹🇼 Taiwan

</button>


<button
class="country"
onclick="showDestinations('Australia')">

🇦🇺 Australia

</button>


<button
class="country"
onclick="showDestinations('Europe')">

🇪🇺 Europe

</button>


</div>


<div id="destinationSection">


<h2 id="destinationTitle"></h2>


<div
id="destinationList"
class="destination-list">

</div>


<button
class="pick"
onclick="randomDestination()">

🎲 PICK FOR ME

</button>


<div
id="result"
class="result">

</div>


<button
class="back"
onclick="goBack()">

← Back

</button>


</div>


</div>


<script>


/* =========================================
   TRAVEL DESTINATIONS
   ========================================= */


const destinations = {


Japan: [

"Tokyo",

"Osaka",

"Kyoto",

"Hokkaido",

"Sapporo",

"Fukuoka",

"Okinawa",

"Nara",

"Hiroshima",

"Nagoya"

],


Korea: [

"Seoul",

"Busan",

"Jeju Island",

"Incheon",

"Gyeongju",

"Daegu",

"Gangneung",

"Jeonju"

],


China: [

"Shanghai",

"Beijing",

"Guangzhou",

"Shenzhen",
"Chongqing",
"Chengdu",
"Guilin",
"Chongqing",
"Xi'an",
"Hangzhou",
"Xinjiang",
"Zhangjiajie",
"Yunnan"
"Tibet",
"Tibet",
"Tibet",

],


Thailand: [

"Bangkok",

"Phuket",

"Chiang Mai",

"Krabi",

"Pattaya",

"Koh Samui",

"Koh Phi Phi",

"Hua Hin"

],


Malaysia: [

"Kuala Lumpur",

"Penang",

"Malacca",

"Langkawi",

"Johor Bahru",

"Kota Kinabalu",

"Cameron Highlands",

"Perhentian Islands"

],


Indonesia: [

"Bali",

"Jakarta",

"Bandung",

"Yogyakarta",

"Lombok",

"Surabaya",

"Komodo",

"Batam"

],


Vietnam: [

"Ho Chi Minh City",

"Hanoi",

"Da Nang",

"Hoi An",

"Nha Trang",

"Ha Long Bay",

"Phu Quoc",

"Da Lat"

],


Taiwan: [

"Taipei",

"Taichung",

"Kaohsiung",

"Hualien",

"Jiufen",

"Yilan",

"Sun Moon Lake",

"Kenting"

],


Australia: [

"Sydney",

"Melbourne",

"Brisbane",

"Gold Coast",

"Perth",

"Adelaide",

"Cairns",

"Great Ocean Road"

],


Europe: [

"Paris",

"London",

"Rome",

"Amsterdam",

"Barcelona",

"Switzerland",

"Prague",

"Vienna",

"Munich",

"Venice"

]

};


/* =========================================
   CURRENT COUNTRY
   ========================================= */


let currentCountry = "";


/* =========================================
   SHOW DESTINATIONS
   ========================================= */


function showDestinations(country) {


    currentCountry = country;


    document
        .getElementById(
            "destinationSection"
        )
        .style.display = "block";


    document
        .getElementById(
            "destinationTitle"
        )
        .textContent =
        "🌏 " + country;


    const list =
        document.getElementById(
            "destinationList"
        );


    list.innerHTML = "";


    destinations[country].forEach(

        function(destination) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "destination";


            item.textContent =
                destination;


            list.appendChild(item);


        }

    );


    document
        .getElementById(
            "result"
        )
        .textContent = "";


}


/* =========================================
   RANDOM DESTINATION
   ========================================= */


function randomDestination() {


    const places =
        destinations[currentCountry];


    const randomIndex =
        Math.floor(
            Math.random() *
            places.length
        );


    const selected =
        places[randomIndex];


    document
        .getElementById(
            "result"
        )
        .textContent =
        "✈️ Let's go to " +
        selected + "!";


}


/* =========================================
   BACK BUTTON
   ========================================= */


function goBack() {


    document
        .getElementById(
            "destinationSection"
        )
        .style.display = "none";


    document
        .getElementById(
            "result"
        )
        .textContent = "";


}


</script>


</body>

</html>
